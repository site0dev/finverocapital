<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soha Bank · Prêt & Investissement</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #f4f7fc;
            color: #1a2a3a;
        }
        .hidden {
            display: none !important;
        }
        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0a2540;
        }
        .topbar .brand small {
            font-weight: 400;
            color: #5a6f8c;
        }
        .topbar .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .topbar .user-info .role-badge {
            background: #eef3f9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #0a2540;
        }
        .topbar .user-info .btn {
            padding: 6px 18px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            background: #0a2540;
            color: white;
        }
        .topbar .user-info .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .nav-tabs .tab {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
        }
        .nav-tabs .tab:hover {
            background: #eef3f9;
        }
        .nav-tabs .tab.active {
            background: #0a2540;
            color: white;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 16px;
            color: #0a2540;
        }
        .flex-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .flex-row>* {
            flex: 1;
            min-width: 180px;
        }
        .stat-box {
            background: #f8faff;
            padding: 16px;
            border-radius: 10px;
            border-left: 4px solid #0a2540;
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #5a6f8c;
        }
        .stat-box .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0a2540;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th,
        td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #e9edf4;
        }
        th {
            color: #5a6f8c;
            font-weight: 600;
        }
        .status {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .status.approved {
            background: #d4edda;
            color: #155724;
        }
        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .status.active {
            background: #d1ecf1;
            color: #0c5460;
        }
        .btn {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary {
            background: #0a2540;
            color: white;
        }
        .btn-primary:hover {
            background: #1d3b5a;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #0a2540;
            color: #0a2540;
        }
        .btn-outline:hover {
            background: #0a2540;
            color: white;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.75rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d9e8;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-auth {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-auth .close {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #aaa;
        }
        .modal-auth .close:hover {
            color: #333;
        }
        .modal-auth h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #0a2540;
        }
        .modal-auth input,
        .modal-auth select {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 16px;
            border: 1px solid #d0d9e8;
            border-radius: 8px;
            font-size: 1rem;
        }
        .modal-auth button {
            width: 100%;
            padding: 14px;
            background: #0a2540;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-auth button:hover {
            background: #1d3b5a;
        }
        .modal-auth .auth-link {
            text-align: center;
            margin-top: 16px;
        }
        .modal-auth .auth-link span {
            color: #0a2540;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-auth .error {
            color: #dc3545;
            margin-top: 8px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-tabs .tab {
                flex: 1;
                text-align: center;
                padding: 8px 12px;
            }
            .flex-row {
                flex-direction: column;
            }
            .modal-auth {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div id="app" class="app">
        <div class="topbar">
            <div class="brand">🏦 Soha Bank <small>· Prêt & Investissement</small></div>
            <div class="user-info">
                <span id="userNameDisplay">Invité</span>
                <span class="role-badge" id="userRoleDisplay">public</span>
                <button id="authActionBtn" class="btn">Se connecter</button>
            </div>
        </div>
        <div id="navTabs" class="nav-tabs"></div>
        <div id="pageContent"></div>
    </div>

    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-auth">
            <span class="close" id="closeModal">&times;</span>
            <div id="authModalContent"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // ✅ CONFIGURATION SUPABASE (VOS IDENTIFIANTS)
        // ============================================================
        const SUPABASE_URL = 'https://xblmpdxhkaieaoajaspn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZiT75rIZ5AiVbNg0R6eReQ_BFrXd7yw';

        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        let currentUser = null;
        let currentRole = null;
        let currentPage = 'home';

        // ============================================================
        // RÉFÉRENCES DOM
        // ============================================================
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userRoleDisplay = document.getElementById('userRoleDisplay');
        const authActionBtn = document.getElementById('authActionBtn');
        const authModal = document.getElementById('authModal');
        const modalContent = document.getElementById('authModalContent');
        const closeModalBtn = document.getElementById('closeModal');

        // ============================================================
        // GESTION DE SESSION SUPABASE
        // ============================================================
        async function checkSession() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserRole();
            } else {
                currentUser = null;
                currentRole = null;
            }
            updateUI();
            buildNavigation();
            navigateTo('home');
        }

        async function fetchUserRole() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', currentUser.id)
                .single();
            if (data) {
                currentRole = data.role;
            } else {
                // Création automatique du profil si inexistant
                await supabase
                    .from('profiles')
                    .insert({ id: currentUser.id, role: 'borrower', full_name: currentUser.email });
                currentRole = 'borrower';
            }
        }

        function updateUI() {
            if (currentUser) {
                const name = currentUser.user_metadata?.full_name || currentUser.email || 'Utilisateur';
                userNameDisplay.textContent = name;
                userRoleDisplay.textContent = currentRole || 'membre';
                authActionBtn.textContent = 'Déconnexion';
                authActionBtn.className = 'btn btn-danger';
            } else {
                userNameDisplay.textContent = 'Invité';
                userRoleDisplay.textContent = 'public';
                authActionBtn.textContent = 'Se connecter';
                authActionBtn.className = 'btn';
            }
        }

        authActionBtn.addEventListener('click', () => {
            if (currentUser) {
                logout();
            } else {
                openAuthModal('login');
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            currentUser = null;
            currentRole = null;
            updateUI();
            buildNavigation();
            navigateTo('home');
            closeModal();
        }

        // ============================================================
        // MODALE AUTH
        // ============================================================
        function openAuthModal(mode = 'login', error = '') {
            authModal.classList.remove('hidden');
            renderAuthForm(mode, error);
        }

        function closeModal() { authModal.classList.add('hidden'); }
        closeModalBtn.addEventListener('click', closeModal);
        authModal.addEventListener('click', (e) => { if (e.target === authModal) closeModal(); });

        function renderAuthForm(mode, error) {
            if (mode === 'login') {
                modalContent.innerHTML = `
                    <h2>🔐 Connexion</h2>
                    <div class="form-group"><label>Email</label><input type="email" id="modalEmail" placeholder="exemple@email.com" /></div>
                    <div class="form-group"><label>Mot de passe</label><input type="password" id="modalPassword" placeholder="••••••••" /></div>
                    <button id="modalLoginBtn">Se connecter</button>
                    <div class="auth-link">Pas encore de compte ? <span id="modalGotoRegister">S'inscrire</span></div>
                    <div class="error">${error}</div>
                `;
                document.getElementById('modalLoginBtn').addEventListener('click', handleLogin);
                document.getElementById('modalGotoRegister').addEventListener('click', () => renderAuthForm('register'));
                document.getElementById('modalPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter')
                        handleLogin(); });
            } else {
                modalContent.innerHTML = `
                    <h2>📝 Créer un compte</h2>
                    <div class="form-group"><label>Nom complet</label><input type="text" id="modalRegisterName" placeholder="Jean Dupont" /></div>
                    <div class="form-group"><label>Email</label><input type="email" id="modalRegisterEmail" placeholder="exemple@email.com" /></div>
                    <div class="form-group"><label>Mot de passe</label><input type="password" id="modalRegisterPassword" placeholder="••••••••" /></div>
                    <div class="form-group"><label>Rôle</label><select id="modalRegisterRole"><option value="borrower">Emprunteur</option><option value="investor">Investisseur</option></select></div>
                    <button id="modalRegisterBtn">S'inscrire</button>
                    <div class="auth-link">Déjà un compte ? <span id="modalGotoLogin">Se connecter</span></div>
                    <div class="error">${error}</div>
                `;
                document.getElementById('modalRegisterBtn').addEventListener('click', handleRegister);
                document.getElementById('modalGotoLogin').addEventListener('click', () => renderAuthForm('login'));
            }
        }

        async function handleLogin() {
            const email = document.getElementById('modalEmail').value.trim();
            const password = document.getElementById('modalPassword').value.trim();
            if (!email || !password) {
                document.querySelector('.modal-auth .error').textContent = 'Veuillez remplir tous les champs.';
                return;
            }
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.querySelector('.modal-auth .error').textContent = error.message;
                return;
            }
            currentUser = data.user;
            await fetchUserRole();
            updateUI();
            buildNavigation();
            navigateTo('dashboard');
            closeModal();
        }

        async function handleRegister() {
            const name = document.getElementById('modalRegisterName').value.trim();
            const email = document.getElementById('modalRegisterEmail').value.trim();
            const password = document.getElementById('modalRegisterPassword').value.trim();
            const role = document.getElementById('modalRegisterRole').value;
            if (!name || !email || !password) {
                document.querySelector('.modal-auth .error').textContent = 'Tous les champs sont requis.';
                return;
            }
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: name, role } }
            });
            if (error) {
                document.querySelector('.modal-auth .error').textContent = error.message;
                return;
            }
            if (data.user) {
                await supabase.from('profiles').insert({ id: data.user.id, full_name: name, role });
            }
            alert('Compte créé ! Connectez-vous.');
            renderAuthForm('login', 'Inscription réussie, connectez-vous.');
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function buildNavigation() {
            const navTabs = document.getElementById('navTabs');
            navTabs.innerHTML = '';
            const tabs = [
                { id: 'home', label: '🏠 Accueil', public: true },
                { id: 'projects', label: '📌 Projets', public: true },
                { id: 'loans-public', label: '📋 Prêts disponibles', public: true },
            ];
            if (currentUser) {
                if (currentRole === 'borrower') {
                    tabs.push({ id: 'dashboard', label: '📊 Mon tableau' });
                    tabs.push({ id: 'request-loan', label: '📝 Demander un prêt' });
                    tabs.push({ id: 'my-loans', label: '📋 Mes prêts' });
                    tabs.push({ id: 'repayments', label: '💰 Remboursements' });
                } else if (currentRole === 'investor') {
                    tabs.push({ id: 'dashboard', label: '📊 Mon tableau' });
                    tabs.push({ id: 'portfolio', label: '💼 Mon portefeuille' });
                } else if (currentRole === 'admin') {
                    tabs.push({ id: 'dashboard', label: '📊 Admin' });
                    tabs.push({ id: 'users', label: '👥 Utilisateurs' });
                    tabs.push({ id: 'admin-loans', label: '📋 Prêts' });
                    tabs.push({ id: 'investments', label: '📈 Investissements' });
                    tabs.push({ id: 'transactions', label: '💳 Transactions' });
                    tabs.push({ id: 'kyc', label: '🛡️ KYC' });
                    tabs.push({ id: 'documents', label: '📄 Documents' });
                }
            }
            tabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = 'tab' + (currentPage === tab.id ? ' active' : '');
                div.textContent = tab.label;
                div.dataset.page = tab.id;
                div.addEventListener('click', () => navigateTo(tab.id));
                navTabs.appendChild(div);
            });
        }

        function navigateTo(pageId) {
            currentPage = pageId;
            document.querySelectorAll('.nav-tabs .tab').forEach(el => {
                el.classList.toggle('active', el.dataset.page === pageId);
            });
            renderPage(pageId);
        }

        // ============================================================
        // RENDU DES PAGES
        // ============================================================
        function renderPage(pageId) {
            const container = document.getElementById('pageContent');
            container.innerHTML = '';

            if (pageId === 'home') {
                container.innerHTML = `
                    <div class="card"><h3>🏦 Bienvenue sur Soha Bank</h3><p>Plateforme de prêt et investissement. Connectez-vous pour interagir.</p></div>
                    <div class="flex-row">
                        <div class="stat-box"><div class="label">Projets ouverts</div><div class="value" id="publicProjectsCount">0</div></div>
                        <div class="stat-box"><div class="label">Prêts approuvés</div><div class="value" id="publicLoansCount">0</div></div>
                        <div class="stat-box"><div class="label">Total investi</div><div class="value" id="publicTotalInvested">0 €</div></div>
                    </div>
                    ${makeCard('📌 Projets', '<div id="publicProjectsList">Chargement...</div>')}
                    ${makeCard('📋 Prêts récents', '<div id="publicLoansList">Chargement...</div>')}
                `;
                loadPublicData();
                return;
            }

            if (pageId === 'projects') {
                container.innerHTML = makeCard('📌 Tous les projets', '<div id="allProjectsList">Chargement...</div>');
                loadAllProjects();
                return;
            }

            if (pageId === 'loans-public') {
                container.innerHTML = makeCard('📋 Prêts disponibles', '<div id="allLoansList">Chargement...</div>');
                loadAllLoans();
                return;
            }

            if (!currentUser) {
                container.innerHTML =
                    `<div class="card"><h3>🔒 Accès réservé</h3><p>Connectez-vous pour accéder à vos fonctionnalités.</p><button class="btn btn-primary" id="gotoAuth">Se connecter</button></div>`;
                document.getElementById('gotoAuth')?.addEventListener('click', () => openAuthModal('login'));
                return;
            }

            if (pageId === 'dashboard') {
                if (currentRole === 'borrower') {
                    container.innerHTML = `
                        <div class="flex-row">
                            <div class="stat-box"><div class="label">Prêts en cours</div><div class="value" id="borrowerLoanCount">0</div></div>
                            <div class="stat-box"><div class="label">Demandes en attente</div><div class="value" id="borrowerPendingCount">0</div></div>
                        </div>
                        ${makeCard('Mes prêts', '<div id="borrowerLoanList">Chargement...</div>')}
                    `;
                    loadBorrowerDashboard();
                } else if (currentRole === 'investor') {
                    container.innerHTML = `
                        <div class="flex-row">
                            <div class="stat-box"><div class="label">Portefeuille</div><div class="value" id="investorPortfolioValue">0 €</div></div>
                            <div class="stat-box"><div class="label">Investissements</div><div class="value" id="investorCount">0</div></div>
                        </div>
                        ${makeCard('Mes investissements', '<div id="investorInvestList">Chargement...</div>')}
                    `;
                    loadInvestorDashboard();
                } else if (currentRole === 'admin') {
                    container.innerHTML = `
                        <div class="flex-row">
                            <div class="stat-box"><div class="label">Utilisateurs</div><div class="value" id="adminUserCount">0</div></div>
                            <div class="stat-box"><div class="label">Prêts actifs</div><div class="value" id="adminLoanCount">0</div></div>
                            <div class="stat-box"><div class="label">Investissements</div><div class="value" id="adminInvestCount">0</div></div>
                        </div>
                        ${makeCard('Activité récente', '<div id="adminActivity">Chargement...</div>')}
                    `;
                    loadAdminDashboard();
                }
                return;
            }

            if (pageId === 'request-loan') {
                container.innerHTML = `
                    <div class="card">
                        <h3>📝 Demander un prêt</h3>
                        <form id="loanRequestForm">
                            <div class="form-group"><label>Montant (€)</label><input type="number" id="loanAmount" required /></div>
                            <div class="form-group"><label>Durée (mois)</label><input type="number" id="loanDuration" required /></div>
                            <div class="form-group"><label>Objet</label><textarea id="loanPurpose" placeholder="Décrivez votre projet..."></textarea></div>
                            <button type="submit" class="btn btn-primary">Soumettre</button>
                        </form>
                        <div id="loanRequestMessage"></div>
                    </div>
                `;
                document.getElementById('loanRequestForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const amount = parseFloat(document.getElementById('loanAmount').value);
                    const duration = parseInt(document.getElementById('loanDuration').value);
                    const purpose = document.getElementById('loanPurpose').value;
                    if (!amount || !duration) {
                        document.getElementById('loanRequestMessage').innerHTML =
                            '<span style="color:red;">Veuillez remplir tous les champs.</span>';
                        return;
                    }
                    const { error } = await supabase
                        .from('loans')
                        .insert({ borrower_id: currentUser.id, amount, duration_months: duration, purpose,
                            status: 'pending', created_at: new Date().toISOString() });
                    if (error) {
                        document.getElementById('loanRequestMessage').innerHTML =
                            `<span style="color:red;">Erreur : ${error.message}</span>`;
                    } else {
                        document.getElementById('loanRequestMessage').innerHTML =
                            '<span style="color:green;">✅ Demande soumise !</span>';
                        document.getElementById('loanRequestForm').reset();
                    }
                });
                return;
            }

            if (pageId === 'my-loans') {
                container.innerHTML = makeCard('Mes prêts', '<div id="myLoansList">Chargement...</div>');
                loadMyLoans();
                return;
            }

            if (pageId === 'repayments') {
                container.innerHTML = makeCard('💰 Remboursements', '<div id="repaymentsList">Chargement...</div>');
                loadRepayments();
                return;
            }

            if (pageId === 'portfolio') {
                container.innerHTML = makeCard('💼 Portefeuille', '<div id="portfolioList">Chargement...</div>');
                loadPortfolio();
                return;
            }

            if (pageId === 'users') {
                container.innerHTML = makeCard('👥 Utilisateurs', '<div id="adminUsersList">Chargement...</div>');
                loadAdminUsers();
                return;
            }
            if (pageId === 'admin-loans') {
                container.innerHTML = makeCard('📋 Gestion des prêts', '<div id="adminLoansList">Chargement...</div>');
                loadAdminLoans();
                return;
            }
            if (pageId === 'investments') {
                container.innerHTML = makeCard('📈 Investissements', '<div id="adminInvestmentsList">Chargement...</div>');
                loadAdminInvestments();
                return;
            }
            if (pageId === 'transactions') {
                container.innerHTML = makeCard('💳 Transactions', '<div id="adminTransactionsList">Chargement...</div>');
                loadAdminTransactions();
                return;
            }
            if (pageId === 'kyc') {
                container.innerHTML = makeCard('🛡️ KYC', '<div id="adminKycList">Chargement...</div>');
                loadAdminKyc();
                return;
            }
            if (pageId === 'documents') {
                container.innerHTML = makeCard('📄 Documents', '<div id="adminDocumentsList">Chargement...</div>');
                loadAdminDocuments();
                return;
            }

            container.innerHTML = `<div class="card"><p>Page en construction.</p></div>`;
        }

        async function loadPublicData() {

            html2 += '</table>';
            document.getElementById('publicLoansList').innerHTML = html2;

        async function loadAllProjects() {
            const { data: projects } = await supabase.from('projects').select('*').eq('status', 'open').order(
                'created_at', { ascending: false });
            let html = '<table><tr><th>Nom</th><th>Description</th><th>Montant</th><th>Action</th></tr>';
            if (projects && projects.length) {
                projects.forEach(p => {
                    const action = currentUser ?
                        `<button class="btn btn-primary invest-btn" data-id="${p.id}">Investir</button>` :
                        `<button class="btn btn-outline" onclick="openAuthModal('login')">Connectez-vous</button>`;
                    html +=
                        `<tr><td><strong>${p.name}</strong></td><td>${p.description || '-'}</td><td>${p.amount_required} €</td><td>${action}</td></tr>`;
                });
            } else { html += '<tr><td colspan="4">Aucun projet</td></tr>'; }
            html += '</table>';
            document.getElementById('allProjectsList').innerHTML = html;

            document.querySelectorAll('.invest-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const amount = prompt('Montant à investir (€) :');
                    if (amount && !isNaN(amount) && parseFloat(amount) > 0) {
                        const { error } = await supabase
                            .from('investments')
                            .insert({ investor_id: currentUser.id, project_id: id, amount: parseFloat(
                                    amount), status: 'active', created_at: new Date()
                                .toISOString() });
                        if (error) alert('Erreur: ' + error.message);
                        else alert('✅ Investissement réalisé !');
                        loadAllProjects();
                    }
                });
            });
        }

        async function loadAdminLoans() {
            const { data: loans } = await supabase.from('loans').select('*, profiles(full_name)').order('created_at',
                { ascending: false });
            let html = '<table><tr><th>Emprunteur</th><th>Montant</th><th>Statut</th><th>Action</th></tr>';
            if (loans && loans.length) {
                loans.forEach(l => {
                    const actions = l.status === 'pending' ?
                        `<button class="btn btn-success btn-sm approve-btn" data-id="${l.id}">Approuver</button> <button class="btn btn-danger btn-sm reject-btn" data-id="${l.id}">Rejeter</button>` :
                        '-';
                    html +=
                        `<tr><td>${l.profiles?.full_name || l.borrower_id}</td><td>${l.amount} €</td><td><span class="status ${l.status}">${l.status}</span></td><td>${actions}</td></tr>`;
                });
            } else { html += '<tr><td colspan="4">Aucun prêt</td></tr>'; }
            html += '</table>';
            document.getElementById('adminLoansList').innerHTML = html;

            document.querySelectorAll('.approve-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await supabase.from('loans').update({ status: 'approved' }).eq('id', btn.dataset.id);
                    loadAdminLoans();
                });
            });
            document.querySelectorAll('.reject-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await supabase.from('loans').update({ status: 'rejected' }).eq('id', btn.dataset.id);
                    loadAdminLoans();

        async function loadAdminTransactions() {
            const { data: loans } = await supabase.from('loans').select('amount, created_at, status');
            const { data: invs } = await supabase.from('investments').select('amount, created_at');
            let rows = [];
            if (loans) loans.forEach(l => rows.push({ type: 'Prêt', amount: l.amount, date: l.created_at }));
            if (invs) invs.forEach(i => rows.push({ type: 'Invest', amount: i.amount, date: i.created_at }));
            rows.sort((a, b) => new Date(b.date) - new Date(a.date));
            let html = '<table><tr><th>Type</th><th>Montant</th><th>Date</th></tr>';
            if (rows.length) {
                rows.slice(0, 15).forEach(r => { html +=
                        `<tr><td>${r.type}</td><td>${r.amount} €</td><td>${new Date(r.date).toLocaleDateString()}</td></tr>`; });
            } else { html += '<tr><td colspan="3">Aucune transaction</td></tr>'; }
            html += '</table>';
            document.getElementById('adminTransactionsList').innerHTML = html;
        }
