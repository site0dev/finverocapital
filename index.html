<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soha Bank</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7fc; color: #1a2a3a; }
        a { text-decoration: none; color: inherit; }
        .hidden { display: none !important; }

        /* ----- CONTAINERS ----- */
        .page { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .auth-page { max-width: 420px; margin: 60px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .auth-page h2 { text-align: center; margin-bottom: 24px; color: #0a2540; }
        .auth-page input { width: 100%; padding: 12px 16px; margin: 8px 0 16px; border: 1px solid #d0d9e8; border-radius: 8px; font-size: 1rem; }
        .auth-page button { width: 100%; padding: 14px; background: #0a2540; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .auth-page button:hover { background: #1d3b5a; }
        .auth-link { text-align: center; margin-top: 16px; }
        .auth-link span { color: #0a2540; font-weight: 600; cursor: pointer; }

        /* ----- TOP BAR ----- */
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 24px; }
        .topbar .brand { font-size: 1.5rem; font-weight: 700; color: #0a2540; }
        .topbar .brand small { font-weight: 400; color: #5a6f8c; }
        .topbar .user-info { display: flex; align-items: center; gap: 16px; }
        .topbar .user-info .role-badge { background: #eef3f9; padding: 4px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; color: #0a2540; }
        .topbar .user-info button { background: #e74c3c; color: white; border: none; padding: 6px 16px; border-radius: 30px; cursor: pointer; font-weight: 600; }

        /* ----- NAV TABS ----- */
        .nav-tabs { display: flex; gap: 4px; background: white; border-radius: 12px; padding: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 24px; flex-wrap: wrap; }
        .nav-tabs .tab { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.15s; }
        .nav-tabs .tab:hover { background: #eef3f9; }
        .nav-tabs .tab.active { background: #0a2540; color: white; }

        /* ----- CARDS & TABLES ----- */
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card h3 { margin-bottom: 16px; color: #0a2540; }
        .flex-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .flex-row > * { flex: 1; min-width: 200px; }
        .stat-box { background: #f8faff; padding: 16px; border-radius: 10px; border-left: 4px solid #0a2540; }
        .stat-box .label { font-size: 0.8rem; color: #5a6f8c; }
        .stat-box .value { font-size: 1.8rem; font-weight: 700; color: #0a2540; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #e9edf4; }
        th { color: #5a6f8c; font-weight: 600; }
        .status { padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .status.pending { background: #fff3cd; color: #856404; }
        .status.approved { background: #d4edda; color: #155724; }
        .status.rejected { background: #f8d7da; color: #721c24; }
        .status.completed { background: #cce5ff; color: #004085; }
        .btn { display: inline-block; padding: 6px 16px; border-radius: 30px; font-weight: 600; font-size: 0.8rem; border: none; cursor: pointer; transition: 0.15s; }
        .btn-primary { background: #0a2540; color: white; }
        .btn-primary:hover { background: #1d3b5a; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-outline { background: transparent; border: 1px solid #0a2540; color: #0a2540; }
        .btn-outline:hover { background: #0a2540; color: white; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0d9e8; border-radius: 8px; font-size: 0.95rem; }
        .form-group textarea { resize: vertical; min-height: 80px; }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            .topbar { flex-direction: column; gap: 12px; align-items: stretch; }
            .nav-tabs .tab { flex: 1; text-align: center; padding: 8px 12px; }
            .flex-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- ===================== AUTH PAGES ===================== -->
<div id="authContainer">
    <!-- LOGIN -->
    <div id="loginPage" class="auth-page">
        <h2>🔐 Connexion</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="exemple@email.com" />
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button id="loginBtn">Se connecter</button>
        <div class="auth-link">Pas encore de compte ? <span id="gotoRegister">S'inscrire</span></div>
        <div id="loginError" style="color:#dc3545; margin-top:12px; text-align:center;"></div>
    </div>

    <!-- REGISTER -->
    <div id="registerPage" class="auth-page hidden">
        <h2>📝 Créer un compte</h2>
        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" id="registerName" placeholder="Jean Dupont" />
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="registerEmail" placeholder="exemple@email.com" />
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="registerPassword" placeholder="••••••••" />
        </div>
        <div class="form-group">
            <label>Rôle</label>
            <select id="registerRole">
                <option value="borrower">Emprunteur</option>
                <option value="investor">Investisseur</option>
            </select>
        </div>
        <button id="registerBtn">S'inscrire</button>
        <div class="auth-link">Déjà un compte ? <span id="gotoLogin">Se connecter</span></div>
        <div id="registerError" style="color:#dc3545; margin-top:12px; text-align:center;"></div>
    </div>
</div>

<!-- ===================== APP (after auth) ===================== -->
<div id="appContainer" class="hidden">

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="brand">🏦 Soha Bank <small>· Plateforme de prêt</small></div>
        <div class="user-info">
            <span id="userNameDisplay">Utilisateur</span>
            <span class="role-badge" id="userRoleDisplay">rôle</span>
            <button id="logoutBtn">Déconnexion</button>
        </div>
    </div>

    <!-- NAVIGATION TABS (générés par JS) -->
    <div id="navTabs" class="nav-tabs"></div>

    <!-- PAGES -->
    <div id="pageContent"></div>
</div>

<script>
    // ============================================================
    // 1. CONFIGURATION SUPABASE (remplacez par vos valeurs)
    // ============================================================
    const SUPABASE_URL = 'https://votre-projet.supabase.co';
    const SUPABASE_ANON_KEY = 'votre-clé-anon';
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 2. ÉTAT GLOBAL
    // ============================================================
    let currentUser = null;        // utilisateur connecté (objet Supabase)
    let currentRole = null;       // 'borrower', 'investor', 'admin'
    let currentPage = 'dashboard'; // nom de la page active

    // ============================================================
    // 3. AUTHENTIFICATION
    // ============================================================
    const authContainer = document.getElementById('authContainer');
    const appContainer = document.getElementById('appContainer');

    // Éléments des pages auth
    const loginPage = document.getElementById('loginPage');
    const registerPage = document.getElementById('registerPage');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const registerName = document.getElementById('registerName');
    const registerEmail = document.getElementById('registerEmail');
    const registerPassword = document.getElementById('registerPassword');
    const registerRole = document.getElementById('registerRole');
    const registerBtn = document.getElementById('registerBtn');
    const registerError = document.getElementById('registerError');

    // Basculer entre login et register
    document.getElementById('gotoRegister').addEventListener('click', () => {
        loginPage.classList.add('hidden');
        registerPage.classList.remove('hidden');
    });
    document.getElementById('gotoLogin').addEventListener('click', () => {
        registerPage.classList.add('hidden');
        loginPage.classList.remove('hidden');
    });

    // Fonction pour vérifier la session existante
    async function checkSession() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            await fetchUserRole();
            showApp();
        } else {
            showAuth();
        }
    }

    // Récupérer le rôle depuis la table 'profiles'
    async function fetchUserRole() {
        if (!currentUser) return;
        const { data, error } = await supabase
            .from('profiles')
            .select('role')
            .eq('id', currentUser.id)
            .single();
        if (data) {
            currentRole = data.role;
        } else {
            // Fallback: si pas de profil, on crée un profil par défaut (emprunteur)
            const { error: insertError } = await supabase
                .from('profiles')
                .insert({ id: currentUser.id, role: 'borrower', full_name: currentUser.email });
            if (!insertError) currentRole = 'borrower';
        }
    }

    // Connexion
    loginBtn.addEventListener('click', async () => {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();
        if (!email || !password) {
            loginError.textContent = 'Veuillez remplir tous les champs.';
            return;
        }
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            loginError.textContent = error.message;
            return;
        }
        currentUser = data.user;
        await fetchUserRole();
        showApp();
    });

    // Inscription
    registerBtn.addEventListener('click', async () => {
        const name = registerName.value.trim();
        const email = registerEmail.value.trim();
        const password = registerPassword.value.trim();
        const role = registerRole.value;
        if (!name || !email || !password) {
            registerError.textContent = 'Veuillez remplir tous les champs.';
            return;
        }
        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
                data: { full_name: name, role: role }
            }
        });
        if (error) {
            registerError.textContent = error.message;
            return;
        }
        // Créer le profil
        if (data.user) {
            const { error: profileError } = await supabase
                .from('profiles')
                .insert({ id: data.user.id, full_name: name, role: role });
            if (profileError) console.error('Erreur création profil:', profileError);
        }
        alert('Compte créé ! Connectez-vous.');
        registerPage.classList.add('hidden');
        loginPage.classList.remove('hidden');
    });

    // Déconnexion
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        currentUser = null;
        currentRole = null;
        showAuth();
    });

    // Afficher les pages d'auth
    function showAuth() {
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
        loginPage.classList.remove('hidden');
        registerPage.classList.add('hidden');
        loginError.textContent = '';
        registerError.textContent = '';
    }

    // Afficher l'application
    function showApp() {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        // Mettre à jour les infos utilisateur
        document.getElementById('userNameDisplay').textContent = currentUser?.user_metadata?.full_name || currentUser?.email || 'Utilisateur';
        document.getElementById('userRoleDisplay').textContent = currentRole || 'inconnu';
        buildNavigation();
        navigateTo('dashboard');
    }

    // ============================================================
    // 4. NAVIGATION
    // ============================================================
    function buildNavigation() {
        const navTabs = document.getElementById('navTabs');
        navTabs.innerHTML = '';
        let tabs = [];
        if (currentRole === 'borrower') {
            tabs = [
                { id: 'dashboard', label: '📊 Tableau de bord' },
                { id: 'request-loan', label: '📝 Demander un prêt' },
                { id: 'my-loans', label: '📋 Mes prêts' },
                { id: 'repayments', label: '💰 Remboursements' },
            ];
        } else if (currentRole === 'investor') {
            tabs = [
                { id: 'dashboard', label: '📊 Tableau de bord' },
                { id: 'projects', label: '📌 Projets' },
                { id: 'portfolio', label: '💼 Portefeuille' },
            ];
        } else if (currentRole === 'admin') {
            tabs = [
                { id: 'dashboard', label: '📊 Admin' },
                { id: 'users', label: '👥 Utilisateurs' },
                { id: 'loans', label: '📋 Prêts' },
                { id: 'investments', label: '📈 Investissements' },
                { id: 'transactions', label: '💳 Transactions' },
                { id: 'kyc', label: '🛡️ KYC' },
                { id: 'documents', label: '📄 Documents' },
            ];
        }
        tabs.forEach(tab => {
            const div = document.createElement('div');
            div.className = 'tab' + (currentPage === tab.id ? ' active' : '');
            div.textContent = tab.label;
            div.dataset.page = tab.id;
            div.addEventListener('click', () => navigateTo(tab.id));
            navTabs.appendChild(div);
        });
    }

    function navigateTo(pageId) {
        currentPage = pageId;
        // Mettre à jour les classes actives
        document.querySelectorAll('.nav-tabs .tab').forEach(el => {
            el.classList.toggle('active', el.dataset.page === pageId);
        });
        renderPage(pageId);
    }

    // ============================================================
    // 5. RENDU DES PAGES (SIMPLIFIÉ MAIS FONCTIONNEL)
    // ============================================================
    function renderPage(pageId) {
        const container = document.getElementById('pageContent');
        container.innerHTML = '';

        // Fonctions utilitaires pour générer du HTML
        function makeCard(title, content) {
            return `<div class="card"><h3>${title}</h3>${content}</div>`;
        }

        // --- PAGE DASHBOARD (générique selon rôle) ---
        if (pageId === 'dashboard') {
            if (currentRole === 'borrower') {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="stat-box"><div class="label">Solde disponible</div><div class="value">0 €</div></div>
                        <div class="stat-box"><div class="label">Prêts en cours</div><div class="value" id="borrowerLoanCount">0</div></div>
                        <div class="stat-box"><div class="label">Prochain remboursement</div><div class="value">-</div></div>
                    </div>
                    ${makeCard('📋 Résumé des prêts', `<div id="borrowerLoanList">Chargement...</div>`)}
                `;
                loadBorrowerDashboard();
            } else if (currentRole === 'investor') {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="stat-box"><div class="label">Portefeuille investi</div><div class="value" id="investorPortfolioValue">0 €</div></div>
                        <div class="stat-box"><div class="label">Projets actifs</div><div class="value" id="investorProjectCount">0</div></div>
                        <div class="stat-box"><div class="label">Retour estimé</div><div class="value" id="investorReturns">0 €</div></div>
                    </div>
                    ${makeCard('📈 Derniers investissements', `<div id="investorInvestList">Chargement...</div>`)}
                `;
                loadInvestorDashboard();
            } else if (currentRole === 'admin') {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="stat-box"><div class="label">Total utilisateurs</div><div class="value" id="adminUserCount">0</div></div>
                        <div class="stat-box"><div class="label">Prêts actifs</div><div class="value" id="adminLoanCount">0</div></div>
                        <div class="stat-box"><div class="label">Investissements totaux</div><div class="value" id="adminInvestmentTotal">0 €</div></div>
                    </div>
                    ${makeCard('📊 Activité récente', `<div id="adminActivity">Chargement...</div>`)}
                `;
                loadAdminDashboard();
            }
        }

        // --- BORROWER PAGES ---
        else if (pageId === 'request-loan' && currentRole === 'borrower') {
            container.innerHTML = `
                <div class="card">
                    <h3>📝 Demander un prêt</h3>
                    <form id="loanRequestForm">
                        <div class="form-group"><label>Montant (€)</label><input type="number" id="loanAmount" required /></div>
                        <div class="form-group"><label>Durée (mois)</label><input type="number" id="loanDuration" required /></div>
                        <div class="form-group"><label>Objet</label><textarea id="loanPurpose" placeholder="Décrivez votre projet..."></textarea></div>
                        <button type="submit" class="btn btn-primary">Soumettre la demande</button>
                    </form>
                    <div id="loanRequestMessage"></div>
                </div>
            `;
            document.getElementById('loanRequestForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const amount = parseFloat(document.getElementById('loanAmount').value);
                const duration = parseInt(document.getElementById('loanDuration').value);
                const purpose = document.getElementById('loanPurpose').value;
                if (!amount || !duration) {
                    document.getElementById('loanRequestMessage').innerHTML = '<span style="color:red;">Veuillez remplir tous les champs.</span>';
                    return;
                }
                const { error } = await supabase
                    .from('loans')
                    .insert({
                        borrower_id: currentUser.id,
                        amount: amount,
                        duration_months: duration,
                        purpose: purpose,
                        status: 'pending',
                        created_at: new Date().toISOString()
                    });
                if (error) {
                    document.getElementById('loanRequestMessage').innerHTML = `<span style="color:red;">Erreur : ${error.message}</span>`;
                } else {
                    document.getElementById('loanRequestMessage').innerHTML = '<span style="color:green;">✅ Demande soumise avec succès !</span>';
                    document.getElementById('loanRequestForm').reset();
                }
            });
        }

        else if (pageId === 'my-loans' && currentRole === 'borrower') {
            container.innerHTML = makeCard('📋 Mes prêts', `<div id="borrowerLoansTable">Chargement...</div>`);
            loadBorrowerLoans();
        }

        else if (pageId === 'repayments' && currentRole === 'borrower') {
            container.innerHTML = makeCard('💰 Remboursements', `<div id="repaymentsTable">Chargement...</div>`);
            loadRepayments();
        }

        // --- INVESTOR PAGES ---
        else if (pageId === 'projects' && currentRole === 'investor') {
            container.innerHTML = makeCard('📌 Projets disponibles', `<div id="investorProjectsList">Chargement...</div>`);
            loadInvestorProjects();
        }

        else if (pageId === 'portfolio' && currentRole === 'investor') {
            container.innerHTML = makeCard('💼 Portefeuille', `<div id="investorPortfolioTable">Chargement...</div>`);
            loadInvestorPortfolio();
        }

        // --- ADMIN PAGES ---
        else if (pageId === 'users' && currentRole === 'admin') {
            container.innerHTML = makeCard('👥 Utilisateurs', `<div id="adminUsersTable">Chargement...</div>`);
            loadAdminUsers();
        }
        else if (pageId === 'loans' && currentRole === 'admin') {
            container.innerHTML = makeCard('📋 Gestion des prêts', `<div id="adminLoansTable">Chargement...</div>`);
            loadAdminLoans();
        }
        else if (pageId === 'investments' && currentRole === 'admin') {
            container.innerHTML = makeCard('📈 Investissements', `<div id="adminInvestmentsTable">Chargement...</div>`);
            loadAdminInvestments();
        }
        else if (pageId === 'transactions' && currentRole === 'admin') {
            container.innerHTML = makeCard('💳 Transactions', `<div id="adminTransactionsTable">Chargement...</div>`);
            loadAdminTransactions();
        }
        else if (pageId === 'kyc' && currentRole === 'admin') {
            container.innerHTML = makeCard('🛡️ KYC', `<div id="adminKycTable">Chargement...</div>`);
            loadAdminKyc();
        }
        else if (pageId === 'documents' && currentRole === 'admin') {
            container.innerHTML = makeCard('📄 Documents', `<div id="adminDocumentsTable">Chargement...</div>`);
            loadAdminDocuments();
        }
        else {
            container.innerHTML = `<div class="card"><p>Page en construction ou non accessible.</p></div>`;
        }
    }

    // ============================================================
    // 6. FONCTIONS DE CHARGEMENT DES DONNÉES (API Supabase)
    // ============================================================

    // --- BORROWER DASHBOARD ---
    async function loadBorrowerDashboard() {
        const { data, error } = await supabase
            .from('loans')
            .select('id')
            .eq('borrower_id', currentUser.id)
            .in('status', ['approved', 'pending']);
        const count = data ? data.length : 0;
        document.getElementById('borrowerLoanCount').textContent = count;
        // Liste des prêts
        const { data: loans } = await supabase
            .from('loans')
            .select('*')
            .eq('borrower_id', currentUser.id)
            .order('created_at', { ascending: false })
            .limit(5);
        let html = '<table><tr><th>Montant</th><th>Statut</th><th>Date</th></tr>';
        if (loans && loans.length) {
            loans.forEach(l => {
                html += `<tr><td>${l.amount} €</td><td><span class="status ${l.status}">${l.status}</span></td><td>${new Date(l.created_at).toLocaleDateString()}</td></tr>`;
            });
        } else {
            html += '<tr><td colspan="3">Aucun prêt</td></tr>';
        }
        html += '</table>';
        document.getElementById('borrowerLoanList').innerHTML = html;
    }

    // --- BORROWER LOANS ---
    async function loadBorrowerLoans() {
        const { data, error } = await supabase
            .from('loans')
            .select('*')
            .eq('borrower_id', currentUser.id)
            .order('created_at', { ascending: false });
        let html = '<table><tr><th>Montant</th><th>Durée (mois)</th><th>Objet</th><th>Statut</th><th>Date</th></tr>';
        if (data && data.length) {
            data.forEach(l => {
                html += `<tr><td>${l.amount} €</td><td>${l.duration_months}</td><td>${l.purpose || '-'}</td><td><span class="status ${l.status}">${l.status}</span></td><td>${new Date(l.created_at).toLocaleDateString()}</td></tr>`;
            });
        } else {
            html += '<tr><td colspan="5">Aucun prêt</td></tr>';
        }
        html += '</table>';
        document.getElementById('borrowerLoansTable').innerHTML = html;
    }

    // --- REPAYMENTS ---
    async function loadRepayments() {
        // Simuler des remboursements : on récupère les prêts approuvés et on génère des échéances
        const { data: loans } = await supabase
            .from('loans')
            .select('*')
            .eq('borrower_id', currentUser.id)
            .eq('status', 'approved');
        let html = '<table><tr><th>Prêt</th><th>Mensualité</th><th>Date échéance</th><th>Statut</th></tr>';
        if (loans && loans.length) {
            // Pour simplifier, on affiche une ligne par prêt avec un montant fictif
            loans.forEach(l => {
                const monthly = (l.amount / l.duration_months).toFixed(2);
                const due = new Date();
                due.setMonth(due.getMonth() + 1);
                html += `<tr><td>${l.amount} €</td><td>${monthly} €</td><td>${due.toLocaleDateString()}</td><td><span class="status pending">à venir</span></td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucun remboursement prévu</td></tr>';
        }
        html += '</table>';
        document.getElementById('repaymentsTable').innerHTML = html;
    }

    // --- INVESTOR DASHBOARD ---
    async function loadInvestorDashboard() {
        // Total investi
        const { data: investments } = await supabase
            .from('investments')
            .select('amount')
            .eq('investor_id', currentUser.id);
        let total = 0;
        if (investments) investments.forEach(i => total += i.amount);
        document.getElementById('investorPortfolioValue').textContent = total.toFixed(2) + ' €';

        // Nombre de projets actifs (on compte les investissements uniques)
        const { data: projects } = await supabase
            .from('investments')
            .select('project_id')
            .eq('investor_id', currentUser.id);
        const uniqueProjects = new Set(projects ? projects.map(p => p.project_id) : []);
        document.getElementById('investorProjectCount').textContent = uniqueProjects.size;

        // Retour estimé (simulé : 5% du total)
        document.getElementById('investorReturns').textContent = (total * 0.05).toFixed(2) + ' €';

        // Derniers investissements
        const { data: lastInv } = await supabase
            .from('investments')
            .select('*, projects(name)')
            .eq('investor_id', currentUser.id)
            .order('created_at', { ascending: false })
            .limit(5);
        let html = '<table><tr><th>Projet</th><th>Montant</th><th>Date</th></tr>';
        if (lastInv && lastInv.length) {
            lastInv.forEach(inv => {
                html += `<tr><td>${inv.projects?.name || 'Projet'}</td><td>${inv.amount} €</td><td>${new Date(inv.created_at).toLocaleDateString()}</td></tr>`;
            });
        } else {
            html += '<tr><td colspan="3">Aucun investissement</td></tr>';
        }
        html += '</table>';
        document.getElementById('investorInvestList').innerHTML = html;
    }

    // --- INVESTOR PROJECTS ---
    async function loadInvestorProjects() {
        // On récupère tous les projets avec leur besoin de financement
        const { data: projects } = await supabase
            .from('projects')
            .select('*')
            .eq('status', 'open');
        let html = '<table><tr><th>Nom</th><th>Description</th><th>Montant requis</th><th>Collecté</th><th>Action</th></tr>';
        if (projects && projects.length) {
            for (const p of projects) {
                // Calculer le montant collecté
                const { data: invs } = await supabase
                    .from('investments')
                    .select('amount')
                    .eq('project_id', p.id);
                let collected = 0;
                if (invs) invs.forEach(i => collected += i.amount);
                const progress = p.amount_required > 0 ? (collected / p.amount_required * 100).toFixed(0) : 0;
                html += `<tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.description || '-'}</td>
                    <td>${p.amount_required} €</td>
                    <td>${collected.toFixed(2)} € (${progress}%)</td>
                    <td><button class="btn btn-primary invest-btn" data-project-id="${p.id}">Investir</button></td>
                </tr>`;
            }
        } else {
            html += '<tr><td colspan="5">Aucun projet disponible</td></tr>';
        }
        html += '</table>';
        document.getElementById('investorProjectsList').innerHTML = html;

        // Ajouter les événements des boutons "Investir"
        document.querySelectorAll('.invest-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const projectId = btn.dataset.projectId;
                const amount = prompt('Montant à investir (€) :');
                if (amount && !isNaN(amount) && parseFloat(amount) > 0) {
                    investInProject(projectId, parseFloat(amount));
                }
            });
        });
    }

    async function investInProject(projectId, amount) {
        const { error } = await supabase
            .from('investments')
            .insert({
                investor_id: currentUser.id,
                project_id: projectId,
                amount: amount,
                status: 'active',
                created_at: new Date().toISOString()
            });
        if (error) {
            alert('Erreur : ' + error.message);
        } else {
            alert('✅ Investissement réalisé avec succès !');
            navigateTo('projects');
        }
    }

    // --- INVESTOR PORTFOLIO ---
    async function loadInvestorPortfolio() {
        const { data: investments } = await supabase
            .from('investments')
            .select('*, projects(name, amount_required)')
            .eq('investor_id', currentUser.id);
        let html = '<table><tr><th>Projet</th><th>Montant investi</th><th>Date</th><th>Statut</th></tr>';
        if (investments && investments.length) {
            investments.forEach(inv => {
                html += `<tr><td>${inv.projects?.name || 'Projet'}</td><td>${inv.amount} €</td><td>${new Date(inv.created_at).toLocaleDateString()}</td><td><span class="status active">actif</span></td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucun investissement</td></tr>';
        }
        html += '</table>';
        document.getElementById('investorPortfolioTable').innerHTML = html;
    }

    // --- ADMIN DASHBOARD ---
    async function loadAdminDashboard() {
        const { count: userCount } = await supabase.from('profiles').select('*', { count: 'exact', head: true });
        document.getElementById('adminUserCount').textContent = userCount || 0;

        const { count: loanCount } = await supabase.from('loans').select('*', { count: 'exact', head: true }).eq('status', 'approved');
        document.getElementById('adminLoanCount').textContent = loanCount || 0;

        const { data: invs } = await supabase.from('investments').select('amount');
        let total = 0;
        if (invs) invs.forEach(i => total += i.amount);
        document.getElementById('adminInvestmentTotal').textContent = total.toFixed(2) + ' €';

        // Activité récente (ex: 5 derniers prêts)
        const { data: recentLoans } = await supabase
            .from('loans')
            .select('*, profiles(full_name)')
            .order('created_at', { ascending: false })
            .limit(5);
        let html = '<table><tr><th>Emprunteur</th><th>Montant</th><th>Statut</th><th>Date</th></tr>';
        if (recentLoans && recentLoans.length) {
            recentLoans.forEach(l => {
                html += `<tr><td>${l.profiles?.full_name || l.borrower_id}</td><td>${l.amount} €</td><td><span class="status ${l.status}">${l.status}</span></td><td>${new Date(l.created_at).toLocaleDateString()}</td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucune activité</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminActivity').innerHTML = html;
    }

    // --- ADMIN USERS ---
    async function loadAdminUsers() {
        const { data: users } = await supabase.from('profiles').select('*');
        let html = '<table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Action</th></tr>';
        if (users && users.length) {
            users.forEach(u => {
                html += `<tr><td>${u.full_name || '-'}</td><td>${u.email || u.id}</td><td>${u.role}</td><td><button class="btn btn-outline btn-sm" onclick="alert('Gestion utilisateur à implémenter')">Modifier</button></td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucun utilisateur</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminUsersTable').innerHTML = html;
    }

    // --- ADMIN LOANS ---
    async function loadAdminLoans() {
        const { data: loans } = await supabase
            .from('loans')
            .select('*, profiles(full_name)')
            .order('created_at', { ascending: false });
        let html = '<table><tr><th>Emprunteur</th><th>Montant</th><th>Durée</th><th>Statut</th><th>Action</th></tr>';
        if (loans && loans.length) {
            loans.forEach(l => {
                html += `<tr>
                    <td>${l.profiles?.full_name || l.borrower_id}</td>
                    <td>${l.amount} €</td>
                    <td>${l.duration_months} mois</td>
                    <td><span class="status ${l.status}">${l.status}</span></td>
                    <td>
                        ${l.status === 'pending' ? `<button class="btn btn-success btn-sm approve-loan" data-id="${l.id}">Approuver</button> <button class="btn btn-danger btn-sm reject-loan" data-id="${l.id}">Rejeter</button>` : '-'}
                    </td>
                </tr>`;
            });
        } else {
            html += '<tr><td colspan="5">Aucun prêt</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminLoansTable').innerHTML = html;

        // Événements pour approuver/rejeter
        document.querySelectorAll('.approve-loan').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const { error } = await supabase.from('loans').update({ status: 'approved' }).eq('id', id);
                if (!error) { alert('Prêt approuvé'); navigateTo('loans'); }
            });
        });
        document.querySelectorAll('.reject-loan').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const { error } = await supabase.from('loans').update({ status: 'rejected' }).eq('id', id);
                if (!error) { alert('Prêt rejeté'); navigateTo('loans'); }
            });
        });
    }

    // --- ADMIN INVESTMENTS ---
    async function loadAdminInvestments() {
        const { data: invs } = await supabase
            .from('investments')
            .select('*, projects(name), profiles(full_name)')
            .order('created_at', { ascending: false });
        let html = '<table><tr><th>Investisseur</th><th>Projet</th><th>Montant</th><th>Date</th></tr>';
        if (invs && invs.length) {
            invs.forEach(inv => {
                html += `<tr><td>${inv.profiles?.full_name || inv.investor_id}</td><td>${inv.projects?.name || 'Projet'}</td><td>${inv.amount} €</td><td>${new Date(inv.created_at).toLocaleDateString()}</td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucun investissement</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminInvestmentsTable').innerHTML = html;
    }

    // --- ADMIN TRANSACTIONS ---
    async function loadAdminTransactions() {
        // Simuler des transactions (on peut fusionner prêts + investissements)
        const { data: loans } = await supabase.from('loans').select('amount, created_at, status');
        const { data: invs } = await supabase.from('investments').select('amount, created_at');
        let rows = [];
        if (loans) loans.forEach(l => rows.push({ type: 'Prêt', amount: l.amount, date: l.created_at, status: l.status }));
        if (invs) invs.forEach(i => rows.push({ type: 'Investissement', amount: i.amount, date: i.created_at, status: 'terminé' }));
        rows.sort((a,b) => new Date(b.date) - new Date(a.date));
        let html = '<table><tr><th>Type</th><th>Montant</th><th>Date</th><th>Statut</th></tr>';
        if (rows.length) {
            rows.slice(0, 20).forEach(r => {
                html += `<tr><td>${r.type}</td><td>${r.amount} €</td><td>${new Date(r.date).toLocaleDateString()}</td><td><span class="status ${r.status}">${r.status}</span></td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucune transaction</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminTransactionsTable').innerHTML = html;
    }

    // --- ADMIN KYC ---
    async function loadAdminKyc() {
        // Simuler des demandes KYC (on peut utiliser la table 'kyc' si elle existe)
        const { data: kyc } = await supabase.from('kyc').select('*, profiles(full_name)').order('created_at', { ascending: false });
        let html = '<table><tr><th>Utilisateur</th><th>Type</th><th>Statut</th><th>Action</th></tr>';
        if (kyc && kyc.length) {
            kyc.forEach(k => {
                html += `<tr><td>${k.profiles?.full_name || k.user_id}</td><td>${k.document_type || 'ID'}</td><td><span class="status ${k.status}">${k.status}</span></td><td><button class="btn btn-success btn-sm">Vérifier</button></td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucune demande KYC</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminKycTable').innerHTML = html;
    }

    // --- ADMIN DOCUMENTS ---
    async function loadAdminDocuments() {
        const { data: docs } = await supabase.from('documents').select('*, profiles(full_name)').order('created_at', { ascending: false });
        let html = '<table><tr><th>Utilisateur</th><th>Nom du fichier</th><th>Date</th><th>Action</th></tr>';
        if (docs && docs.length) {
            docs.forEach(d => {
                html += `<tr><td>${d.profiles?.full_name || d.user_id}</td><td>${d.file_name}</td><td>${new Date(d.created_at).toLocaleDateString()}</td><td><a href="#" class="btn btn-outline btn-sm">Télécharger</a></td></tr>`;
            });
        } else {
            html += '<tr><td colspan="4">Aucun document</td></tr>';
        }
        html += '</table>';
        document.getElementById('adminDocumentsTable').innerHTML = html;
    }

    checkSession();
