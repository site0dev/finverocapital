<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soha Bank · Prêt & Investissement</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #f4f7fc;
            color: #1a2a3a;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .hidden {
            display: none !important;
        }

        /* ----- CONTAINERS ----- */
        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ----- TOP BAR ----- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0a2540;
        }
        .topbar .brand small {
            font-weight: 400;
            color: #5a6f8c;
        }
        .topbar .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .topbar .user-info .role-badge {
            background: #eef3f9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #0a2540;
        }
        .topbar .user-info .btn {
            padding: 6px 18px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            background: #0a2540;
            color: white;
        }
        .topbar .user-info .btn-outline {
            background: transparent;
            border: 1px solid #0a2540;
            color: #0a2540;
        }
        .topbar .user-info .btn-outline:hover {
            background: #0a2540;
            color: white;
        }
        .topbar .user-info .btn-danger {
            background: #e74c3c;
            color: white;
        }

        /* ----- NAV TABS ----- */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .nav-tabs .tab {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
        }
        .nav-tabs .tab:hover {
            background: #eef3f9;
        }
        .nav-tabs .tab.active {
            background: #0a2540;
            color: white;
        }

        /* ----- CARDS & TABLES ----- */
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 16px;
            color: #0a2540;
        }
        .flex-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .flex-row>* {
            flex: 1;
            min-width: 180px;
        }
        .stat-box {
            background: #f8faff;
            padding: 16px;
            border-radius: 10px;
            border-left: 4px solid #0a2540;
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #5a6f8c;
        }
        .stat-box .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0a2540;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th,
        td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #e9edf4;
        }
        th {
            color: #5a6f8c;
            font-weight: 600;
        }
        .status {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .status.approved {
            background: #d4edda;
            color: #155724;
        }
        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .status.completed {
            background: #cce5ff;
            color: #004085;
        }
        .status.active {
            background: #d1ecf1;
            color: #0c5460;
        }
        .btn {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary {
            background: #0a2540;
            color: white;
        }
        .btn-primary:hover {
            background: #1d3b5a;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #0a2540;
            color: #0a2540;
        }
        .btn-outline:hover {
            background: #0a2540;
            color: white;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.75rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d9e8;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ----- MODAL AUTH ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-auth {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-auth .close {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #aaa;
        }
        .modal-auth .close:hover {
            color: #333;
        }
        .modal-auth h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #0a2540;
        }
        .modal-auth input,
        .modal-auth select {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 16px;
            border: 1px solid #d0d9e8;
            border-radius: 8px;
            font-size: 1rem;
        }
        .modal-auth button {
            width: 100%;
            padding: 14px;
            background: #0a2540;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-auth button:hover {
            background: #1d3b5a;
        }
        .modal-auth .auth-link {
            text-align: center;
            margin-top: 16px;
        }
        .modal-auth .auth-link span {
            color: #0a2540;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-auth .error {
            color: #dc3545;
            margin-top: 8px;
            text-align: center;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-tabs .tab {
                flex: 1;
                text-align: center;
                padding: 8px 12px;
            }
            .flex-row {
                flex-direction: column;
            }
            .modal-auth {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div id="app" class="app">

        <!-- TOP BAR -->
        <div class="topbar">
            <div class="brand">🏦 Soha Bank <small>· Prêt & Investissement</small></div>
            <div class="user-info">
                <span id="userNameDisplay">Invité</span>
                <span class="role-badge" id="userRoleDisplay">public</span>
                <button id="authActionBtn" class="btn">Se connecter</button>
            </div>
        </div>

        <!-- NAVIGATION TABS (générés par JS) -->
        <div id="navTabs" class="nav-tabs"></div>

        <!-- CONTENU PRINCIPAL -->
        <div id="pageContent"></div>
    </div>

    <!-- MODALE D'AUTHENTIFICATION (cachée par défaut) -->
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-auth">
            <span class="close" id="closeModal">&times;</span>
            <div id="authModalContent">
                <!-- Contenu dynamique : login ou register -->
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURATION SUPABASE (à remplacer)
        // ============================================================
        const SUPABASE_URL = 'https://votre-projet.supabase.co';
        const SUPABASE_ANON_KEY = 'votre-clé-anon';
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 2. ÉTAT GLOBAL
        // ============================================================
        let currentUser = null; // null = non connecté
        let currentRole = null; // 'borrower', 'investor', 'admin'
        let currentPage = 'home';

        // ============================================================
        // 3. RÉFÉRENCES DOM
        // ============================================================
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userRoleDisplay = document.getElementById('userRoleDisplay');
        const authActionBtn = document.getElementById('authActionBtn');
        const authModal = document.getElementById('authModal');
        const modalContent = document.getElementById('authModalContent');
        const closeModalBtn = document.getElementById('closeModal');

        // ============================================================
        // 4. AUTHENTIFICATION – GESTION DE LA SESSION
        // ============================================================

        // Vérifier la session au chargement
        async function checkSession() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserRole();
            } else {
                currentUser = null;
                currentRole = null;
            }
            updateUI();
            buildNavigation();
            navigateTo('home');
        }

        // Récupérer le rôle depuis la table 'profiles'
        async function fetchUserRole() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', currentUser.id)
                .single();
            if (data) {
                currentRole = data.role;
            } else {
                // Création automatique du profil si inexistant
                await supabase
                    .from('profiles')
                    .insert({ id: currentUser.id, role: 'borrower', full_name: currentUser.email });
                currentRole = 'borrower';
            }
        }

        // Mettre à jour l'interface utilisateur
        function updateUI() {
            if (currentUser) {
                const name = currentUser.user_metadata?.full_name || currentUser.email || 'Utilisateur';
                userNameDisplay.textContent = name;
                userRoleDisplay.textContent = currentRole || 'membre';
                authActionBtn.textContent = 'Déconnexion';
                authActionBtn.className = 'btn btn-danger';
            } else {
                userNameDisplay.textContent = 'Invité';
                userRoleDisplay.textContent = 'public';
                authActionBtn.textContent = 'Se connecter';
                authActionBtn.className = 'btn';
            }
        }

        // Action du bouton en haut à droite
        authActionBtn.addEventListener('click', () => {
            if (currentUser) {
                logout();
            } else {
                openAuthModal('login');
            }
        });

        // Déconnexion
        async function logout() {
            await supabase.auth.signOut();
            currentUser = null;
            currentRole = null;
            updateUI();
            buildNavigation();
            navigateTo('home');
            closeModal();
        }

        // ============================================================
        // 5. MODALE D'AUTHENTIFICATION
        // ============================================================

        function openAuthModal(mode = 'login', message = '') {
            authModal.classList.remove('hidden');
            renderAuthForm(mode, message);
        }

        function closeModal() {
            authModal.classList.add('hidden');
        }

        closeModalBtn.addEventListener('click', closeModal);
        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) closeModal();
        });

        function renderAuthForm(mode, errorMsg = '') {
            if (mode === 'login') {
                modalContent.innerHTML = `
                    <h2>🔐 Connexion</h2>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="modalEmail" placeholder="exemple@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="modalPassword" placeholder="••••••••" />
                    </div>
                    <button id="modalLoginBtn">Se connecter</button>
                    <div class="auth-link">Pas encore de compte ? <span id="modalGotoRegister">S'inscrire</span></div>
                    <div class="error" id="modalError">${errorMsg}</div>
                `;
                document.getElementById('modalLoginBtn').addEventListener('click', () => handleLogin());
                document.getElementById('modalGotoRegister').addEventListener('click', () => renderAuthForm('register'));
                // Enter key support
                document.getElementById('modalPassword').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleLogin();
                });
            } else {
                modalContent.innerHTML = `
                    <h2>📝 Créer un compte</h2>
                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" id="modalRegisterName" placeholder="Jean Dupont" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="modalRegisterEmail" placeholder="exemple@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="modalRegisterPassword" placeholder="••••••••" />
                    </div>
                    <div class="form-group">
                        <label>Rôle</label>
                        <select id="modalRegisterRole">
                            <option value="borrower">Emprunteur</option>
                            <option value="investor">Investisseur</option>
                        </select>
                    </div>
                    <button id="modalRegisterBtn">S'inscrire</button>
                    <div class="auth-link">Déjà un compte ? <span id="modalGotoLogin">Se connecter</span></div>
                    <div class="error" id="modalError">${errorMsg}</div>
                `;
                document.getElementById('modalRegisterBtn').addEventListener('click', () => handleRegister());
                document.getElementById('modalGotoLogin').addEventListener('click', () => renderAuthForm('login'));
            }
        }

        // Fonctions de login/register
        async function handleLogin() {
            const email = document.getElementById('modalEmail').value.trim();
            const password = document.getElementById('modalPassword').value.trim();
            if (!email || !password) {
                document.getElementById('modalError').textContent = 'Veuillez remplir tous les champs.';
                return;
            }
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('modalError').textContent = error.message;
                return;
            }
            currentUser = data.user;
            await fetchUserRole();
            updateUI();
            buildNavigation();
            navigateTo('dashboard');
            closeModal();
        }

        async function handleRegister() {
            const name = document.getElementById('modalRegisterName').value.trim();
            const email = document.getElementById('modalRegisterEmail').value.trim();
            const password = document.getElementById('modalRegisterPassword').value.trim();
            const role = document.getElementById('modalRegisterRole').value;
            if (!name || !email || !password) {
                document.getElementById('modalError').textContent = 'Tous les champs sont requis.';
                return;
            }
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: name, role } }
            });
            if (error) {
                document.getElementById('modalError').textContent = error.message;
                return;
            }
            if (data.user) {
                await supabase
                    .from('profiles')
                    .insert({ id: data.user.id, full_name: name, role });
            }
            alert('Compte créé ! Connectez-vous.');
            renderAuthForm('login', 'Inscription réussie, connectez-vous.');
        }

        // ============================================================
        // 6. NAVIGATION (publiques + privées)
        // ============================================================

        function buildNavigation() {
            const navTabs = document.getElementById('navTabs');
            navTabs.innerHTML = '';

            // Onglets publics toujours visibles
            const tabs = [
                { id: 'home', label: '🏠 Accueil', public: true },
                { id: 'projects', label: '📌 Projets', public: true },
                { id: 'loans-public', label: '📋 Prêts disponibles', public: true },
            ];

            // Onglets privés (selon rôle)
            if (currentUser) {
                if (currentRole === 'borrower') {
                    tabs.push({ id: 'dashboard', label: '📊 Mon tableau', private: true });
                    tabs.push({ id: 'request-loan', label: '📝 Demander un prêt', private: true });
                    tabs.push({ id: 'my-loans', label: '📋 Mes prêts', private: true });
                    tabs.push({ id: 'repayments', label: '💰 Remboursements', private: true });
                } else if (currentRole === 'investor') {
                    tabs.push({ id: 'dashboard', label: '📊 Mon tableau', private: true });
                    tabs.push({ id: 'portfolio', label: '💼 Mon portefeuille', private: true });
                } else if (currentRole === 'admin') {
                    tabs.push({ id: 'dashboard', label: '📊 Admin', private: true });
                    tabs.push({ id: 'users', label: '👥 Utilisateurs', private: true });
                    tabs.push({ id: 'admin-loans', label: '📋 Prêts', private: true });
                    tabs.push({ id: 'investments', label: '📈 Investissements', private: true });
                    tabs.push({ id: 'transactions', label: '💳 Transactions', private: true });
                    tabs.push({ id: 'kyc', label: '🛡️ KYC', private: true });
                    tabs.push({ id: 'documents', label: '📄 Documents', private: true });
                }
            }

            tabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = 'tab' + (currentPage === tab.id ? ' active' : '');
                div.textContent = tab.label;
                div.dataset.page = tab.id;
                div.addEventListener('click', () => navigateTo(tab.id));
                navTabs.appendChild(div);
            });
        }

        function navigateTo(pageId) {
            currentPage = pageId;
            // Mettre à jour l'active
            document.querySelectorAll('.nav-tabs .tab').forEach(el => {
                el.classList.toggle('active', el.dataset.page === pageId);
            });
            renderPage(pageId);
        }

        // ============================================================
        // 7. RENDU DES PAGES
        // ============================================================

        function renderPage(pageId) {
            const container = document.getElementById('pageContent');
            container.innerHTML = '';

            // Page d'accueil publique
            if (pageId === 'home') {
                container.innerHTML = `
                    <div class="card">
                        <h3>🏦 Bienvenue sur Soha Bank</h3>
                        <p>Plateforme de prêt entre particuliers et investissement responsable.</p>
                        <p style="margin-top:12px;">Connectez-vous pour accéder à vos fonctionnalités personnalisées.</p>
                    </div>
                    <div class="flex-row">
                        <div class="stat-box"><div class="label">Projets ouverts</div><div class="value" id="publicProjectsCount">0</div></div>
                        <div class="stat-box"><div class="label">Prêts en cours</div><div class="value" id="publicLoansCount">0</div></div>
                        <div class="stat-box"><div class="label">Montant total investi</div><div class="value" id="publicTotalInvested">0 €</div></div>
                    </div>
                    ${makeCard('📌 Derniers projets', '<div id="publicProjectsList">Chargement...</div>')}
                    ${makeCard('📋 Derniers prêts', '<div id="publicLoansList">Chargement...</div>')}
                `;
                loadPublicData();
                return;
            }

            // Pages publiques : Projets
            if (pageId === 'projects') {
                container.innerHTML = makeCard('📌 Tous les projets d\'investissement', '<div id="publicProjectsFull">Chargement...</div>');
                loadAllProjects();
                return;
            }

            // Pages publiques : Prêts disponibles
            if (pageId === 'loans-public') {
                container.innerHTML = makeCard('📋 Prêts disponibles à financer', '<div id="publicLoansFull">Chargement...</div>');
                loadAllLoans();
                return;
            }

            // ---- PAGES PRIVÉES (nécessitent connexion) ----
            if (!currentUser) {
                container.innerHTML = `
                    <div class="card">
                        <h3>🔒 Accès réservé</h3>
                        <p>Veuillez vous connecter ou créer un compte pour accéder à cette page.</p>
                        <button class="btn btn-primary" id="gotoAuthFromPage">Se connecter / S'inscrire</button>
                    </div>
                `;
                document.getElementById('gotoAuthFromPage')?.addEventListener('click', () => openAuthModal('login'));
                return;
            }

            // Pages privées selon rôle
            if (currentRole === 'borrower') {
                if (pageId === 'dashboard') renderBorrowerDashboard();
                else if (pageId === 'request-loan') renderRequestLoan();
                else if (pageId === 'my-loans') renderMyLoans();
                else if (pageId === 'repayments') renderRepayments();
                else container.innerHTML = '<div class="card"><p>Page non disponible</p></div>';
            } else if (currentRole === 'investor') {
                if (pageId === 'dashboard') renderInvestorDashboard();
                else if (pageId === 'portfolio') renderInvestorPortfolio();
                else container.innerHTML = '<div class="card"><p>Page non disponible</p></div>';
            } else if (currentRole === 'admin') {
                if (pageId === 'dashboard') renderAdminDashboard();
                else if (pageId === 'users') renderAdminUsers();
                else if (pageId === 'admin-loans') renderAdminLoans();
                else if (pageId === 'investments') renderAdminInvestments();
                else if (pageId === 'transactions') renderAdminTransactions();
                else if (pageId === 'kyc') renderAdminKyc();
                else if (pageId === 'documents') renderAdminDocuments();
                else container.innerHTML = '<div class="card"><p>Page non disponible</p></div>';
            } else {
                container.innerHTML = '<div class="card"><p>Rôle inconnu.</p></div>';
            }
        }

        // Helper pour générer une carte
        function makeCard(title, content) {
            return `<div class="card"><h3>${title}</h3>${content}</div>`;
        }

        // ============================================================
        // 8. CHARGEMENT DES DONNÉES PUBLIQUES
        // ============================================================

        async function loadPublicData() {
            // Nombre de projets ouverts
            const { count: projectCount } = await supabase
                .from('projects')
                .select('*', { count: 'exact', head: true })
                .eq('status', 'open');
            document.getElementById('publicProjectsCount').textContent = projectCount || 0;

            // Nombre de prêts approuvés
            const { count: loanCount } = await supabase
                .from('loans')
                .select('*', { count: 'exact', head: true })
                .eq('status', 'approved');
            document.getElementById('publicLoansCount').textContent = loanCount || 0;

            // Montant total investi
            const { data: investments } = await supabase.from('investments').select('amount');
            let total = 0;
            if (investments) investments.forEach(i => total += i.amount);
            document.getElementById('publicTotalInvested').textContent = total.toFixed(2) + ' €';

            // Derniers projets
            const { data: projects } = await supabase
                .from('projects')
                .select('*')
                .eq('status', 'open')
                .order('created_at', { ascending: false })
                .limit(3);
